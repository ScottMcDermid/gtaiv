name: gtaiv-cars

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: gtaiv-cars:latest
    container_name: gtaiv-cars
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: gtaiv-cars-dev:latest
    container_name: gtaiv-cars-dev
    profiles: ["dev"]
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
